name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js audit examples/record-normalizer --fail-on warning
      - run: node dist/cli.js eval --cases examples/record-normalizer/tests --outputs examples/captured-outputs.json
